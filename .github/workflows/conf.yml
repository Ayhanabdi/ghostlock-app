name: Extract Xiaomi Boot Image

on:
  # اجازه می‌دهد تا این اکشن را به صورت دستی از تب Actions اجرا کنید
  workflow_dispatch:
    inputs:
      ota_url:
        description: 'لینک مستقیم فایل OTA شیائومی (با پسوند .zip)'
        required: true
        default: 'https://bigota.d.miui.com/OS2.0.209.0.VMTMIXM/tapas_global-ota_full-OS2.0.209.0.VMTMIXM-user-15.0-e4778deae7.zip'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Payload Dumper
        run: |
          python -m pip install --upgrade pip
          # نصب کتابخانه پایتون برای استخراج فایل‌های OTA
          pip install payload-dumper-go

      - name: Download OTA File
        run: |
          echo "Downloading OTA from: ${{ github.event.inputs.ota_url }}"
          # دانلود فایل OTA (با قابلیت ادامه دانلود در صورت قطع شدن)
          wget -c -q --show-progress "${{ github.event.inputs.ota_url }}" -O ota.zip

      - name: Extract Payload and Boot
        run: |
          echo "Extracting payload..."
          # استخراج فایل‌های مورد نیاز (boot و xbl_config)
          # ابزار payload-dumper-go فقط فایل‌های مورد نیاز را استخراج می‌کند
          payload-dumper -p boot,xbl_config ota.zip -o ./output/
          
          echo "Extraction complete. Files in output directory:"
          ls -lh ./output/

      - name: Zip Extracted Files
        run: |
          cd output
          zip -r ../extracted_files.zip .
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-extracted-images
          path: extracted_files.zip
          retention-days: 7
