name: Extract Xiaomi Boot Image

on:
  # اجازه می‌دهد تا این اکشن را به صورت دستی از تب Actions اجرا کنید
  workflow_dispatch:
    inputs:
      ota_url:
        description: 'لینک مستقیم فایل OTA شیائومی (با پسوند .zip)'
        required: true
        default: 'https://bigota.d.miui.com/OS2.0.209.0.VMTMIXM/tapas_global-ota_full-OS2.0.209.0.VMTMIXM-user-15.0-e4778deae7.zip'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Payload Dumper Go Binary
        run: |
          echo "Downloading payload-dumper-go using GitHub CLI..."
          # استفاده از gh برای دانلود فایل از بخش Releases پروژه
          gh release download --repo xishang0128/payload-dumper-go --pattern "payload-dumper-linux-amd64" --output payload-dumper-go
          chmod +x payload-dumper-go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download OTA File
        run: |
          echo "Downloading OTA from: ${{ github.event.inputs.ota_url }}"
          # دانلود فایل OTA با نمایش پیشرفت
          wget -c -q --show-progress "${{ github.event.inputs.ota_url }}" -O ota.zip

      - name: Extract Payload and Boot
        run: |
          echo "Extracting payload..."
          # اجرای ابزار با دستور صحیح
          ./payload-dumper-go extract ota.zip -p boot,xbl_config -o ./output/
          
          echo "Extraction complete. Files in output directory:"
          ls -lh ./output/

      - name: Zip Extracted Files
        run: |
          cd output
          zip -r ../extracted_files.zip .
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-extracted-images
          path: extracted_files.zip
          retention-days: 7
