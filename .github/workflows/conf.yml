name: Extract Xiaomi Boot & XBL Config

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: 'لینک مستقیم فایل OTA شیائومی (با پسوند .zip)'
        required: true
        default: 'https://bigota.d.miui.com/OS2.0.209.0.VMTMIXM/tapas_global-ota_full-OS2.0.209.0.VMTMIXM-user-15.0-e4778deae7.zip'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install payload-dumper-rust
        run: |
          echo "Installing payload-dumper-rust..."
          # نصب سریع از طریق اسکریپت رسمی (مخصوص لینوکس)
          bash <(curl -sSL "https://raw.githubusercontent.com/rhythmcache/payload-dumper-rust/main/scripts/install.sh")
          
          # بررسی نصب و نمایش نسخه
          payload_dumper --version

      - name: Extract Partitions from OTA URL
        run: |
          echo "Extracting boot and xbl_config from: ${{ github.event.inputs.ota_url }}"
          # استفاده از ابزار برای استخراج مستقیم از URL
          # -i برای انتخاب پارتیشن‌ها و -o برای پوشه خروجی
          payload_dumper "${{ github.event.inputs.ota_url }}" -i boot,xbl_config -o ./output/
          
          echo "Extraction complete. Files in output directory:"
          ls -lh ./output/

      - name: Zip Extracted Files
        run: |
          cd output
          zip -r ../extracted_files.zip .
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-extracted-images
          path: extracted_files.zip
          retention-days: 7
